---
# Pulls the shared SMTP credentials from the cluster-scoped
# kube-shared-secrets store into the sparkyfitness namespace. Parallel
# to how Readeck / Psono / Vaultwarden get their own copies. App-local
# variant — keeps the SparkyFitness rollout self-contained.
#
# Migration note: if the platform-repo ClusterExternalSecret
# `smtp-cluster-sync` is later extended to include the `sparkyfitness`
# namespace, this file becomes redundant and should be removed to
# avoid two controllers reconciling the same target Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smtp-creds
  namespace: sparkyfitness
spec:
  refreshInterval: 12h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: kube-shared-secrets
  target:
    name: smtp-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: smtp-creds
