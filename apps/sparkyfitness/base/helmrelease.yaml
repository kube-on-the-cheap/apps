---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sparkyfitness
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: sparkyfitness
  targetNamespace: sparkyfitness
  chartRef:
    kind: OCIRepository
    name: sparkyfitness
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: sparkyfitness-values
      valuesKey: values.yaml
