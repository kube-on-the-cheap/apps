---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-resume
spec:
  template:
    spec:
      # The upstream image runs as USER `node` (uid/gid 1000). Fresh
      # openebs-rawfile PVCs come up owned by root:root, so the app
      # crashes on startup with `EACCES: permission denied,
      # access '/app/data'`. Setting fsGroup makes the kubelet chown
      # the mounted volume to gid 1000 on attach and adds SGID so new
      # files inherit the group; `node` can then read/write /app/data.
      securityContext:
        fsGroup: 1000
      containers:
        - name: reactive-resume
          # Tag-only, no digest pin: understairs is a mixed-arch cluster
          # (amd64 mini PC + arm64 Pi), so scheduling can land the pod
          # on either arch. A digest pin locks to one architecture and
          # blows up as `exec format error` on the other; the container
          # runtime resolves the tag against the manifest list at pull
          # time and picks the right image for the node's arch.
          image: amruthpillai/reactive-resume:v5.2.5
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: PORT
              value: "3000"
            - name: APP_URL
              value: "https://cv.homelab.blacksd.tech"
            - name: LOCAL_STORAGE_PATH
              value: "/app/data"
            - name: OAUTH_PROVIDER_NAME
              value: "Authentik"
            - name: OAUTH_DISCOVERY_URL
              value: "https://auth.cloud.blacksd.tech/application/o/reactive-resume/.well-known/openid-configuration"
            - name: OAUTH_SCOPES
              value: "openid profile email"
            - name: FLAG_DISABLE_EMAIL_AUTH
              value: "true"
            # FLAG_DISABLE_SIGNUPS gates OAuth-provisioned signups too
            # (better-auth's genericOAuth plugin binds disableSignUp to
            # this flag). Leaving it "false" is what allows the very
            # first Authentik login to provision a local user record;
            # access is still gated by the authentik_policy_binding to
            # the `grownups` group upstream, so this doesn't open
            # signups to anyone Authentik hasn't already vetted.
            - name: FLAG_DISABLE_SIGNUPS
              value: "false"
            - name: SMTP_HOST
              value: "smtp.email.eu-frankfurt-1.oci.oraclecloud.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURE
              value: "false"
            - name: SMTP_FROM
              value: "Reactive Resume (Marco's Homelab) <do-not-reply@mail.cloud.blacksd.tech>"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-pg-app
                  key: uri
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: AUTH_SECRET
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: OAUTH_CLIENT_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-secrets
                  key: SMTP_PASS
