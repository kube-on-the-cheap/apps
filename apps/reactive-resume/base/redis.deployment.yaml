---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: reactive-resume
  labels:
    app.kubernetes.io/name: reactive-resume
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # emptyDir volume + in-memory-only Redis (no persistence flags), so
  # multiple pods would each have their own state anyway. Recreate
  # keeps semantics obvious: one Redis at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: reactive-resume
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reactive-resume
        app.kubernetes.io/component: redis
    spec:
      # PodSecurity `restricted` requires runAsNonRoot; the redis
      # official image runs as root by default. uid/gid 999 is
      # baked into the image as the `redis` user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # In-memory only. --save "" turns off RDB snapshots; --appendonly no
          # skips the AOF. Restart = fresh DB, which is fine because the AI
          # Agent workspace uses Redis for session-scoped state; anything
          # source-of-truth lives in Postgres.
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
      volumes:
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
