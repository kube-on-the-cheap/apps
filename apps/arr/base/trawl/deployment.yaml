---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: arr
  labels:
    app.kubernetes.io/name: trawl
    app.kubernetes.io/component: solver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trawl
      app.kubernetes.io/component: solver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trawl
        app.kubernetes.io/component: solver
    spec:
      nodeSelector:
        kubernetes.io/hostname: minipc1
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl@sha256:728216a6a5e9654e3235bfa614c71e3847fe5826d3032fa2bca8083719ab355e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8191
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Rome"
            - name: BROWSER_POOL_SIZE
              value: "1"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 15
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
