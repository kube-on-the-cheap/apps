---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
  namespace: linkwarden
  labels:
    app.kubernetes.io/name: linkwarden
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: linkwarden
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkwarden
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z linkwarden-pg-rw 5432; do echo "waiting for linkwarden-pg-rw:5432..."; sleep 2; done
              until nc -z meilisearch 7700; do echo "waiting for meilisearch:7700..."; sleep 2; done
              echo "all deps up"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: linkwarden
          # Tag-only, no digest pin: understairs is a mixed-arch cluster
          # (amd64 mini-PC + arm64 Pi). A digest pin locks to one arch
          # and blows up as `exec format error` on the other; the
          # container runtime resolves the tag against the manifest list
          # at pull time.
          image: ghcr.io/linkwarden/linkwarden:v2.16.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Rome"
            # Trailing /api/v1/auth is required: Linkwarden mounts
            # NextAuth at that prefix (not the default /api/auth), and
            # NEXTAUTH_URL is what NextAuth uses to build callback URLs
            # in its /providers response. Without the suffix, NextAuth
            # advertises /api/auth/callback/oidc, which 404s.
            - name: NEXTAUTH_URL
              value: "https://bookmarks.homelab.blacksd.tech/api/v1/auth"
            - name: MEILI_HOST
              value: "http://meilisearch:7700"
            # STORAGE_FOLDER is intentionally unset. It defaults to a
            # relative path under WORKDIR (/data), and the archives live
            # inside the PVC mounted at /data/data — see volumeMounts below.
            # Kill local signup entirely — OIDC provisions users.
            - name: NEXT_PUBLIC_DISABLE_REGISTRATION
              value: "true"
            # Hide the local (username/password) login form so OIDC is
            # the only visible entry point. Controls NextAuth's
            # credentials provider registration.
            - name: NEXT_PUBLIC_CREDENTIALS_ENABLED
              value: "false"
            - name: NEXT_PUBLIC_OIDC_ENABLED
              value: "true"
            - name: OIDC_CUSTOM_NAME
              value: "Authentik"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkwarden-nextauth-secret
                  key: password
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: linkwarden-meili-master-key
                  key: password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: linkwarden-pg-app
                  key: uri
            - name: OIDC_WELLKNOWN_URL
              valueFrom:
                secretKeyRef:
                  name: linkwarden-oidc
                  key: OIDC_WELLKNOWN_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: linkwarden-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkwarden-oidc
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            # Nested mount: WORKDIR is /data and contains the app tree
            # (apps/, node_modules/, packages/). Mounting the PVC at
            # /data would shadow all of that and break `prisma migrate
            # deploy` on startup. Upstream docker-compose mounts at
            # /data/data; mirror it.
            - name: data
              mountPath: /data/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linkwarden-data
