---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psono-admin-client
  namespace: psono
  labels:
    app.kubernetes.io/name: psono
    app.kubernetes.io/component: admin-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: psono
      app.kubernetes.io/component: admin-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: psono
        app.kubernetes.io/component: admin-client
    spec:
      containers:
        - name: admin-client
          image: docker.io/psono/psono-admin-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # The admin-client serves under /portal internally, so the
            # config.json lives one level deeper than the regular
            # client. Same subPath trick to overlay a single file.
            - name: config
              mountPath: /usr/share/nginx/html/portal/config.json
              subPath: config.json
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /portal/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /portal/
              port: http
            periodSeconds: 30
      volumes:
        # Reuses the same ConfigMap as the regular client — the file
        # shape is identical, only the mount path differs.
        - name: config
          configMap:
            name: psono-client-config
---
apiVersion: v1
kind: Service
metadata:
  name: psono-admin-client
  namespace: psono
spec:
  selector:
    app.kubernetes.io/name: psono
    app.kubernetes.io/component: admin-client
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
