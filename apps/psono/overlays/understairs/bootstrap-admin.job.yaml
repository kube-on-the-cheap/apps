---
# ONE-SHOT bootstrap: seed the first Psono admin user.
#
# NOT included in kustomization.yaml on purpose — Flux must never
# reconcile this. Two commands run back-to-back:
#   1. `createuser <username> <password> <email>` — creates the user.
#   2. `promoteuser <username> superuser` — grants access to the
#      admin portal at /portal. Note: takes username only, NOT email
#      (emails are stored bcrypt-hashed and can't be used as a lookup
#      key). The Psono docs' email example is misleading.
#
# Credentials live SOPS-encrypted in bootstrap-admin.sops.yaml and are
# reconciled into the cluster as the Secret `psono-bootstrap-admin`
# (referenced below via envFrom). To rotate the admin, edit and
# re-encrypt the SOPS file, delete the user in Postgres, then re-run
# this Job.
#
# Username in that Secret MUST be fully qualified (`<user>@<domain>`)
# matching `backend_servers[0].domain` in client-config.json — the
# webclient auto-appends that domain before deriving the authkey, so
# a bare username stored via createuser will not match what the
# client sends at login and every login attempt will fail with
# USERNAME_OR_PASSWORD_WRONG.
#
# Recipe (run against understairs, from the repo root):
#
#   1. Confirm bootstrap-admin.sops.yaml has the values you want
#      (`sops --decrypt apps/psono/overlays/understairs/bootstrap-admin.sops.yaml`).
#   2. Apply:
#        kubectl --context understairs.bat-corn.ts.net \
#          create -f apps/psono/overlays/understairs/bootstrap-admin.job.yaml
#   3. Watch:
#        kubectl --context understairs.bat-corn.ts.net -n psono \
#          logs -f job/psono-bootstrap-admin
#   4. Once Complete, delete the Job:
#        kubectl --context understairs.bat-corn.ts.net -n psono \
#          delete job psono-bootstrap-admin
#      If you also want to purge the credential from the cluster,
#      delete the Secret too:
#        kubectl --context understairs.bat-corn.ts.net -n psono \
#          delete secret psono-bootstrap-admin
#      Flux will recreate the Secret on the next reconcile (15 min);
#      remove bootstrap-admin.sops.yaml from kustomization.yaml if
#      you want it gone permanently.
#
# Re-running is safe if the earlier attempt failed before createuser
# returned; if the user already exists, createuser errors and the Job
# will not retry (backoffLimit=0). Delete the Job and re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: psono-bootstrap-admin
  namespace: psono
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: docker.io/psono/psono-server-enterprise:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              python3 ./psono/manage.py createuser \
                "$PSONO_ADMIN_USERNAME" \
                "$PSONO_ADMIN_PASSWORD" \
                "$PSONO_ADMIN_EMAIL"
              python3 ./psono/manage.py promoteuser \
                "$PSONO_ADMIN_USERNAME" \
                superuser
          # Admin credentials come from the SOPS-decrypted Secret so
          # this Job manifest can live in git without plaintext.
          envFrom:
            - secretRef:
                name: psono-bootstrap-admin
          env:
            # Same non-secret env block as the server Deployment —
            # Django needs the DB URL and crypto keys imported for
            # createuser and promoteuser to work. Secrets sourced
            # from psono-pg-app and psono-server-keys, same as the
            # main Deployment.
            - name: PSONO_DEBUG
              value: "False"
            - name: PSONO_ALLOWED_HOSTS
              value: '["*"]'
            - name: PSONO_ALLOWED_DOMAINS
              value: '["*"]'
            - name: PSONO_HOST_URL
              value: "https://pass.homelab.blacksd.tech/server"
            - name: PSONO_WEB_CLIENT_URL
              value: "https://pass.homelab.blacksd.tech"
            - name: PSONO_MANAGEMENT_ENABLED
              value: "True"
            - name: PSONO_AUTHENTICATION_METHODS
              value: '["AUTHKEY"]'
            - name: PSONO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: psono-pg-app
                  key: uri
            - name: PSONO_SECRET_KEY_FILE
              value: /etc/psono/SECRET_KEY
            - name: PSONO_ACTIVATION_LINK_SECRET_FILE
              value: /etc/psono/ACTIVATION_LINK_SECRET
            - name: PSONO_DB_SECRET_FILE
              value: /etc/psono/DB_SECRET
            - name: PSONO_EMAIL_SECRET_SALT_FILE
              value: /etc/psono/EMAIL_SECRET_SALT
            - name: PSONO_PRIVATE_KEY_FILE
              value: /etc/psono/PRIVATE_KEY
            - name: PSONO_PUBLIC_KEY_FILE
              value: /etc/psono/PUBLIC_KEY
          volumeMounts:
            - name: server-keys
              mountPath: /etc/psono
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: server-keys
          secret:
            secretName: psono-server-keys
            defaultMode: 0400
