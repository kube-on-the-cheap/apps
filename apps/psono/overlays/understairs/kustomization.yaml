apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - cluster.cnpg.yaml
  - smtp-creds.externalsecret.yaml
  - server-keys.sops.yaml
  - httproute.yaml
  # bootstrap-admin.job.yaml is intentionally NOT listed here — it is
  # a one-shot Job applied manually with `kubectl create -f`. See the
  # header comment in that file.
patches:
  - path: server.deployment.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: psono-server
