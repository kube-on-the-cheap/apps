apiVersion: v1
kind: Secret
metadata:
  name: psono-bootstrap-admin
  namespace: psono
type: Opaque
# Consumed by bootstrap-admin.job.yaml via envFrom. The Job itself is
# excluded from the kustomization; this Secret IS included, so it gets
# reconciled into the cluster by Flux and sits idle until the Job
# references it. Deleting the Secret is safe after successful
# bootstrap — the Flux reconcile will recreate it on the next
# interval. If you want the credential fully purged from the cluster,
# also remove this file from kustomization.yaml.
#
# Username MUST be the fully-qualified `<user>@<domain>` form matching
# `backend_servers[0].domain` in client-config.json — otherwise the
# webclient's authkey derivation won't match what createuser stored.
