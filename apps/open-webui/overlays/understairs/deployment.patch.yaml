---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  template:
    spec:
      # Pin to the amd64 mini-PC. Rationale:
      # 1. Image is ~1.6 GB compressed — the arm64 Pi took 20+ min to
      #    pull it once, and its slower CPU couldn't get the app
      #    through startup migrations + Alembic warm-up before the
      #    startup probe timed out (crash loop).
      # 2. Open WebUI is a Python app that will chew CPU under
      #    request load (websocket + upstream API-call fan-out). The
      #    mini-PC has 4× the RAM (~32 GB vs ~8 GB) and faster
      #    per-core throughput.
      # 3. The Pi in this cluster also serves as control plane
      #    workload target; keeping heavy user-facing apps off it
      #    reduces the blast radius of a resource spike.
      # `openebs-rawfile` is node-local storage anyway, so this
      # constraint doesn't restrict us any further than reality
      # already does.
      nodeSelector:
        kubernetes.io/hostname: minipc1
      containers:
        - name: open-webui
          # Tag-only, no digest pin: understairs is a mixed-arch cluster
          # (amd64 mini-PC + arm64 Pi), so scheduling can land the pod
          # on either arch. A digest pin locks to one architecture and
          # blows up as `exec format error` on the other; the container
          # runtime resolves the tag against the manifest list at pull
          # time and picks the right image for the node's arch.
          image: ghcr.io/open-webui/open-webui:v0.11.0
          env:
            - name: TZ
              value: "Etc/UTC"
            - name: PORT
              value: "8080"
            - name: WEBUI_URL
              value: "https://ai.homelab.blacksd.tech"
            - name: WEBUI_AUTH
              value: "true"
            # Signup gates. ENABLE_OAUTH_SIGNUP is orthogonal to
            # ENABLE_SIGNUP at v0.11.0 (verified in Task 0 against
            # backend/open_webui/utils/oauth.py — ENABLE_SIGNUP is not
            # referenced in the OIDC callback path at all; the create-user
            # branch is gated solely on ENABLE_OAUTH_SIGNUP).
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_AUTO_REDIRECT
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "false"
            - name: OPENID_PROVIDER_URL
              value: "https://auth.cloud.blacksd.tech/application/o/open-webui/.well-known/openid-configuration"
            - name: OPENID_REDIRECT_URI
              value: "https://ai.homelab.blacksd.tech/oauth/oidc/login/callback"
            - name: OAUTH_PROVIDER_NAME
              value: "Authentik"
            - name: OAUTH_SCOPES
              value: "openid email profile groups"
            # Role management: at v0.11.0 the upstream role-extraction
            # block is gated on all of (claim, allowed_roles,
            # admin_roles) being non-empty; if any is empty, roles fall
            # through to DEFAULT_USER_ROLE (users get in as regular
            # `user`, NOT 403). The 403 only fires when the roles claim
            # IS populated and doesn't match either list. Both lists
            # below stay populated so the extraction path is exercised
            # and admin sync actually works.
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: "groups"
            - name: OAUTH_ADMIN_ROLES
              value: "admins"
            - name: OAUTH_ALLOWED_ROLES
              value: "grownups,admins"
            - name: DEFAULT_USER_ROLE
              value: "user"
            # Single-replica → in-memory websocket manager is fine.
            # Empty string selects the in-memory manager; skips Redis.
            - name: WEBSOCKET_MANAGER
              value: ""
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: open-webui-pg-app
                  key: uri
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: WEBUI_SECRET_KEY
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OAUTH_CLIENT_SECRET
