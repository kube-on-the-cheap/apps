---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: web
spec:
  replicas: 1
  # RWO PVC → cannot run two pods concurrently; RollingUpdate would
  # deadlock the second pod trying to attach the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z open-webui-pg-rw 5432; do
                echo "waiting for open-webui-pg-rw:5432..."
                sleep 2
              done
              echo "db up"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: open-webui
          # Image tag pinned in the overlay patch.
          image: ghcr.io/open-webui/open-webui:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Open WebUI runs Alembic migrations at startup that grow
          # with every release (v0.11.0 has ~80 upgrade steps). On a
          # cold-boot into an empty DB the sequence can easily take
          # 5+ minutes on this cluster's hardware; a fresh
          # deployment on the arm64 Pi with the ~1.6 GB image
          # crash-looped repeatedly at the previous 5m15s budget.
          # A 20-minute startup budget swallows migration time on
          # any node without disturbing steady-state liveness.
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
