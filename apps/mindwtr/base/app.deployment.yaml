---
# The PWA: nginx serving the pre-built desktop:web bundle. Stateless,
# reads no config — the client discovers its sync backend URL from
# in-app settings at first run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindwtr-app
  namespace: mindwtr
  labels:
    app.kubernetes.io/name: mindwtr
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mindwtr
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindwtr
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: ghcr.io/dongdongbh/mindwtr-app:1.1.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mindwtr-app
  namespace: mindwtr
spec:
  selector:
    app.kubernetes.io/name: mindwtr
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
