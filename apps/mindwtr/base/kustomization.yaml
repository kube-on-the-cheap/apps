apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - app.deployment.yaml
# The sync backend (cloud) is no longer in base — it's a
# per-tenant Component under `components/cloud-tenant` instantiated
# once per user from each cluster overlay's `tenants/<name>` dir.
# The PWA in `app.deployment.yaml` stays shared across all tenants.
