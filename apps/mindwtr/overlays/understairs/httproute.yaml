---
# Per-tenant sync backend routes. One HTTPRoute per tenant so
# add-a-user is a git PR that only touches this file (+ a tenants/<name>
# dir). Gateway API picks the longest-prefix match, so /sync/marco
# wins over the catch-all / below.
#
# URLRewrite strips the /sync/<name> prefix before the request hits
# the backend — the Bun server only knows /v1/* and /health, unaware
# of its tenant prefix. Clients configure sync URL as
# https://todo.homelab.blacksd.tech/sync/marco and the client's own
# `normalizeCloudUrl` appends /v1/data to that full string; verified
# against upstream packages/core/src/sync-helpers.ts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mindwtr-cloud-marco
  namespace: mindwtr
spec:
  parentRefs:
    - name: external
      namespace: envoy-gateway-system
  hostnames:
    - todo.homelab.blacksd.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sync/marco
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: mindwtr-cloud-marco
          port: 80
---
# PWA — catch-all. Serves the static bundle for every tenant. The
# bundle is byte-identical to what's on mindwtr.app and in the app
# stores; there is no per-tenant customization on the client side.
# Users configure their sync URL in-app after first load.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mindwtr-app
  namespace: mindwtr
spec:
  parentRefs:
    - name: external
      namespace: envoy-gateway-system
  hostnames:
    - todo.homelab.blacksd.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mindwtr-app
          port: 80
---
# PWA is gated to LAN + Tailscale only. The bundle itself contains
# no secrets (identical to the public mindwtr.app copy), but this
# keeps the URL from being discoverable to the wider internet and
# prevents random users from consuming the container's resources.
#
# The /sync/<user> backend routes above are intentionally NOT gated:
# the mobile and desktop apps talk to those endpoints with a static
# bearer token from anywhere, and the token IS the auth boundary.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mindwtr-app-ip-filter
  namespace: mindwtr
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mindwtr-app
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            - 192.168.20.0/24
            - 100.64.0.0/10
