apiVersion: v1
kind: Secret
metadata:
  name: mindwtr-auth-tokens
  namespace: mindwtr
type: Opaque
# Bearer tokens gate every /v1/* request. Each token maps to its own
# namespace on the backend (file-per-token JSON storage), so one
# token = one person's data. Rotating a token means updating every
# client that used it; delete old tokens by removing them from the
# comma-separated list.
#
# Generate a new token with:
#   openssl rand -hex 32
# Length must be 20-512 chars (the backend rejects anything outside
# this range).
#
# MINDWTR_CLOUD_CORS_ORIGIN co-lives here because both are
# environment-scoped (the tokens change per install, the origin
# changes per hostname) and both flow into the mindwtr-cloud
# Deployment via the same envFrom secretRef.
stringData:
  MINDWTR_CLOUD_AUTH_TOKENS: ENC[AES256_GCM,data:nvJwoUQLsLrGOgyQ1U+nkR3kj7gltXdvr8P/Qya2Yih7SkLfic1fYk02yHcBjfUqYNLXGPGklZW3oP0xDdvHMg==,iv:Ch4pxlYoLuDznAUl0KNgUTLq+BAgZLZr6hFRdUYKD3I=,tag:AaxsHVJfvgZOC2uD9VVRJQ==,type:str]
  MINDWTR_CLOUD_CORS_ORIGIN: ENC[AES256_GCM,data:E/JMSjLXB3zSnTF6XJS13i54xXGeM/TtlVkw07pOc/Pk,iv:E8NYKCNn8lxPF56K3n1VGg31m+FYfdsqBThYjJYml1I=,tag:1UhypQ3eCqr5SjBuJ7EepA==,type:str]
