apiVersion: v1
kind: Secret
metadata:
  name: mindwtr-auth-token
type: Opaque
# Marco's bearer token. This Secret feeds MINDWTR_CLOUD_AUTH_TOKENS
# on the mindwtr-cloud-marco Deployment (via envFrom + Kustomize's
# `-marco` nameSuffix, which rewrites the Deployment's Secret ref
# to `mindwtr-auth-token-marco`).
#
# Value carried over from the pre-tenancy shared Secret, so no
# client-side reconfiguration is needed on this device — same token
# was already pasted into the PWA + mobile/desktop apps.
#
# Generate a fresh token with:
#   openssl rand -hex 32
# Rotating means editing this file, re-encrypting, letting Flux
# reconcile, then updating every client that used the old value.
