apiVersion: v1
kind: Secret
metadata:
  name: mindwtr-auth-token
type: Opaque
# Marco's bearer token. This Secret feeds MINDWTR_CLOUD_AUTH_TOKENS
# on the mindwtr-cloud-marco Deployment (via envFrom + Kustomize's
# `-marco` nameSuffix, which rewrites the Deployment's Secret ref
# to `mindwtr-auth-token-marco`).
#
# The value below is a PLAINTEXT PLACEHOLDER — replace with your
# memorable token, then re-encrypt in place with:
#   sops -e -i apps/mindwtr/overlays/understairs/tenants/marco/auth-token.sops.yaml
# The path matches `.sops.yaml`'s understairs rule, so the correct
# recipients (understairs cluster age key + Marco PGP + age backup)
# are picked up automatically.
#
# After encrypting and letting Flux reconcile, paste the same value
# into every Mindwtr client (PWA settings, mobile app, desktop app)
# that syncs against this tenant.
