apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Instantiated per tenant from a per-tenant overlay dir. The overlay
# applies a `nameSuffix: -<user>` and a `labels` transformer with
# `includeSelectors: true` adding a `tenant: <user>` pair — this is
# what makes Service selectors and pod labels differ between tenants
# in the same namespace.
resources:
  - deployment.yaml
