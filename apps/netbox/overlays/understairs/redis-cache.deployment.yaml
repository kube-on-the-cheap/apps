---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-redis-cache
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: redis-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox
      app.kubernetes.io/component: redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox
        app.kubernetes.io/component: redis-cache
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          # Password is read from an env var and referenced via $() argv
          # substitution — Kubernetes expands $(REDIS_PASSWORD) at pod
          # start from the env, so the plaintext value never sits in the
          # manifest.
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-redis-cache-password
                  key: password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-redis-cache
  namespace: netbox
spec:
  selector:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/component: redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
