---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  values:
    externalDatabase:
      host: netbox-pg-rw
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-pg-app
      # CNPG's <cluster>-app Secret uses `password` (see the
      # cnpg-database-cr memory note); overrides the chart default of
      # `postgresql-password`.
      existingSecretKey: password

    tasksDatabase:
      host: netbox-redis-queue
      port: 6379
      database: 0
      existingSecretName: netbox-redis-queue-password
      # Chart default is `tasks-password`; ESO-generated Secrets use
      # `password`.
      existingSecretKey: password

    cachingDatabase:
      host: netbox-redis-cache
      port: 6379
      database: 1
      existingSecretName: netbox-redis-cache-password
      # Chart default is `cache-password`; ESO-generated Secrets use
      # `password`.
      existingSecretKey: password

    persistence:
      storageClass: openebs-rawfile
      size: 5Gi

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Pin all NetBox pods (web, worker, housekeeping CronJob) to the
    # amd64 mini-PC. Same escape hatch as Open WebUI / Linkwarden.
    # openebs-rawfile is node-local so this doesn't restrict scheduling
    # any further than reality already does.
    nodeSelector:
      kubernetes.io/hostname: minipc1

    worker:
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 768Mi
      nodeSelector:
        kubernetes.io/hostname: minipc1

    housekeeping:
      nodeSelector:
        kubernetes.io/hostname: minipc1

    allowedHosts:
      - netbox.homelab.blacksd.tech

    remoteAuth:
      enabled: true
      backend: social_core.backends.open_id_connect.OpenIdConnectAuth

    # netbox-docker's configuration.py reads OIDC credentials from
    # FILES under /run/config/extra/<N>/, not from env vars. So we
    # inject them via two extraConfig entries:
    #   [0] .values — non-secret OIDC settings (issuer, scope, flags).
    #   [1] .secret — mounts the SOPS-decrypted `netbox-oidc` Secret,
    #       whose `oidc.yaml` key holds SOCIAL_AUTH_OIDC_KEY and
    #       SOCIAL_AUTH_OIDC_SECRET as YAML scalars. Chart's
    #       configuration.py deep-merges those into globals().
    #
    # Note: no auto-role-sync — the chart cannot inject a custom
    # SOCIAL_AUTH_PIPELINE step through this mechanism (it accepts only
    # scalar YAML). Superusers are promoted manually via
    # `kubectl exec deploy/netbox -- ./manage.py createsuperuser`.
    extraConfig:
      - values:
          REMOTE_AUTH_ENABLED: true
          REMOTE_AUTH_BACKEND: social_core.backends.open_id_connect.OpenIdConnectAuth
          SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: https://auth.cloud.blacksd.tech/application/o/netbox
          # Standard scopes; NO `groups` since we don't sync roles.
          SOCIAL_AUTH_OIDC_SCOPE:
            - openid
            - email
            - profile
          SOCIAL_AUTH_REDIRECT_IS_HTTPS: true
      - secret:
          secretName: netbox-oidc
