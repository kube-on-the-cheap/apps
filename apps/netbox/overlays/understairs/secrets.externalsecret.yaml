---
# netbox-secret-key ESO generator removed: the netbox-chart auto-
# generates Django's SECRET_KEY into its own file-based Secret at
# /run/secrets/netbox/secret_key (read by configuration.py's
# _read_secret helper). An ESO-generated Secret + extraEnvs mapping
# was redundant and never actually consumed by the app.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: netbox-redis-cache-password-generator
  namespace: netbox
spec:
  length: 32
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: netbox-redis-cache-password
  namespace: netbox
spec:
  refreshInterval: "0"
  target:
    name: netbox-redis-cache-password
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: netbox-redis-cache-password-generator
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: netbox-redis-queue-password-generator
  namespace: netbox
spec:
  length: 32
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: netbox-redis-queue-password
  namespace: netbox
spec:
  refreshInterval: "0"
  target:
    name: netbox-redis-queue-password
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: netbox-redis-queue-password-generator
