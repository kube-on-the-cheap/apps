---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: mealie
  targetNamespace: mealie
  chartRef:
    kind: OCIRepository
    name: mealie
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: mealie-values
      valuesKey: values.yaml
